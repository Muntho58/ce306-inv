<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg_bag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#bg_bag)"/>
  <!-- Bag Handle -->
  <path d="M42 50 C42 24, 78 24, 78 50" fill="none" stroke="url(#chrome)" stroke-width="5" stroke-linecap="round"/>
  <!-- Handle Rings -->
  <circle cx="42" cy="50" r="3.5" fill="#64748b"/>
  <circle cx="78" cy="50" r="3.5" fill="#64748b"/>
  <!-- Bag Body -->
  <path d="M28 50 L92 50 L86 98 L34 98 Z" fill="url(#silver)" rx="4"/>
  <!-- Flap -->
  <path d="M28 50 L92 50 L84 76 L36 76 Z" fill="url(#chrome)"/>
  <!-- Metallic Clasp / Lock -->
  <rect x="54" y="70" width="12" height="12" rx="3" fill="#1e293b"/>
  <rect x="57" y="73" width="6" height="6" rx="1" fill="#f8fafc"/>
  <!-- Sheen / Highlight -->
  <path d="M36 56 L46 94" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
